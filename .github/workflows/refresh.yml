name: Refresh league data

# Tuesday mornings during the season -- after Monday Night Football has settled
# and ESPN has finalized the week's scoring. Also runnable on demand.
on:
  schedule:
    - cron: "0 13 * 9,10,11,12,1 2"
  workflow_dispatch:

permissions:
  contents: write   # to commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Steps run in order and the job stops at the first failure, which is the
      # point: nothing below here should run on data that could not be fetched
      # or that does not agree with ESPN's own records.

      # The pipeline is stdlib-only, so there is nothing to install.
      - name: Pull latest from ESPN
        env:
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python3 pipeline/fetch_raw.py --current-season-only

      # The gate. Recomputes every completed season's records from the archive
      # and compares them against the records ESPN itself stored, and checks the
      # analytics invariants. A refresh that quietly corrupted the archive fails
      # here instead of being published.
      - name: Validate against ESPN's own records
        run: python3 pipeline/validate_model.py

      - name: Rebuild site data
        run: python3 pipeline/build_site_data.py

      - name: Commit any changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw site/data
          if git diff --staged --quiet; then
            echo "No change this week."
          else
            git commit -m "Refresh league data $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
