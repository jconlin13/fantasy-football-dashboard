# Public display names for the dashboard.
#
# Only the strings in this file are shown on the site or committed to
# git -- real names from ESPN stay in config/identities.local.json,
# which is gitignored. Suggested names below are first name + last
# initial; edit them freely.
#
# If one person used two ESPN accounts over the years, point the older
# one at the newer with merge_into so their career stats combine:
#
#   [mgr_oldaccount]
#   display = Brendan L.
#   merge_into = mgr_newaccount
#
# Two rules govern this file, and the analytics have to honor both.
#
# 1. MERGE ON TEAMS, NOT ON PEOPLE. A team is one opponent for its whole
#    history. If two people co-managed a team, you hold one record against
#    that team, not one against each of them -- so a co-manager merges into
#    whoever the team has always belonged to, even though they are genuinely
#    a different person.
#
# 2. MANAGERS WHO LEFT STILL COUNT. Someone who had their own team and no
#    longer plays is not merged into anyone and is not filtered out. They
#    stay a manager forever, because everyone else's career record against
#    them is real and has to keep adding up. Never drop a manager for being
#    absent from the current season -- only merge one when their team's
#    history genuinely belongs to somebody else.

