# Public display names for the dashboard.
#
# Only the strings in this file are shown on the site or committed to
# git -- real names from ESPN stay in config/identities.local.json,
# which is gitignored. Suggested names below are first name + last
# initial; edit them freely.
#
# If one person used two ESPN accounts over the years, point the older
# one at the newer with merge_into so their career stats combine:
#
#   [mgr_oldaccount]
#   display = Brendan L.
#   merge_into = mgr_newaccount

