# Which league to archive.
#
# A league id is not a secret -- it is visible in the ESPN URL to anyone in the
# league -- so unlike the auth cookies in .env, this file is committed. The
# fetcher, the site build and the scheduled refresh all read it from here so
# there is exactly one place to change it.

[league]
id = 1069983
name = MHD Fantasy League

# ESPN serves nothing before 2018 for this league; earlier seasons return an
# HTML error page rather than JSON. Verified by probe on 2026-08-05.
first_season = 2018

# LEAVE BLANK. Worked out from the date: September 1st rolls it over to the new
# season, and January still counts as the season being finished rather than the
# next one. That way nobody has to remember to bump this every September.
#
# If ESPN has no such season yet -- the league exists but has not been renewed
# for the new year, which is normal for a week or two each September -- the
# weekly refresh notices, says so in its log, and stays on the previous season
# instead of failing. It picks the new one up by itself on the first Tuesday
# ESPN can actually serve it.
#
# Fill in a year only to pin it, for instance to keep building a finished
# season after the next one has started. A pinned year is taken at its word and
# is NOT stepped back if ESPN cannot serve it, so a wrong one fails loudly.
current_season =
