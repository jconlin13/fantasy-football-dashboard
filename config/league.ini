# Which league to archive.
#
# A league id is not a secret -- it is visible in the ESPN URL to anyone in the
# league -- so unlike the auth cookies in .env, this file is committed. The
# fetcher, the site build and the scheduled refresh all read it from here so
# there is exactly one place to change it.

[league]
id = 1069983
name = MHD Fantasy League

# ESPN serves nothing before 2018 for this league; earlier seasons return an
# HTML error page rather than JSON. Verified by probe on 2026-08-05.
first_season = 2018
current_season = 2026
