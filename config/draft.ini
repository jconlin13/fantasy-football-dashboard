# Everything on the splash page. Edit this file, push, and the site updates --
# there is no admin panel and nothing to log into.
#
# Leave a value blank and its card hides itself rather than showing an empty
# box, so it is safe to fill this in a piece at a time as the draft firms up.

[draft]
# LEAVE BLANK. The draft time comes from ESPN automatically -- schedule the
# draft on the league page and the next refresh picks it up, counting down to
# the same clock the draft room runs on. Until then the page reads "Not set"
# and the countdown stays hidden.
#
# Only fill this in to announce a date before it is set in ESPN; a value here
# overrides ESPN. ISO 8601 with an offset, e.g. 2026-08-28T20:00:00-04:00
# (Eastern is -04:00 during daylight saving, -05:00 after early November).
datetime =

# LEAVE BLANK. The big header on this page reads your league's actual name
# straight from ESPN -- the same one you see on ESPN's own site -- with the
# current season appended automatically. Nobody has to type their league's
# name here for that to work.
#
# Only fill this in if you want a headline that's different from what your
# league is literally named in ESPN. A value here overrides the ESPN name,
# same relationship as `datetime` above.
label =

# Left blank on purpose: this used to say "Live Draft" both in the big header
# above and again as the heading on the details card lower down. Blank here
# means the header shows just the label, and that lower card falls back to
# its own plain "Draft" heading instead of repeating itself.
kind =
location = Zoom

# The League Home button's destination is built automatically from your
# league id and current season in league.ini -- there is nothing to set here.
# Deliberately no teamId in that URL: .../football/team?...&teamId=1 would
# send every visitor to whichever team happens to own that id, regardless of
# who is actually logged in. The plain league URL resolves to whoever is
# signed in. ESPN requires an account that is actually in this league, so
# ESPN -- not this site -- is what keeps strangers out.

# Optional friction in front of that button: visitors type a word the league
# knows. Store the SHA-256 of the word, never the word itself -- generate with:
#
#     python3 pipeline/hash_passphrase.py
#
# Blank = no gate, button always visible.
passphrase_sha256 =

[dues]
amount = $50
# Just your Venmo handle -- the part after the @, e.g. jackconlin for
# @jackconlin. The site builds the full venmo.com/u/... link itself; an @ or
# a pasted full URL both work fine too. Blank shows an "Add Venmo" placeholder
# instead of a working button -- a reminder this is unfinished rather than a
# silent gap, since a missing dues link is exactly the kind of thing worth
# noticing before the group chat does.
# Verified live 2026-09-03: resolves to Jack Conlin / @jackconlin.
venmo_username = jackconlin

[order]
# Draft order, one line per pick:  <pick> = <name>[, <payment status>]
# Commented out = the card hides itself until the order is announced.
#
# Deliberately hand-entered rather than pulled from ESPN. ESPN does expose a
# pick sequence for 2026 already, but the draft is unscheduled and orderType is
# MANUAL, so that sequence is its default placeholder -- publishing it would
# announce an order that is not real.
#
# 1 = Jack C., paid
# 2 = Mike H.
# 3 = Someone Else, mostly paid
